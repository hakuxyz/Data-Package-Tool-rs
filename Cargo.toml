[package]
name = "data-package-tool"
version = "0.1.0"
edition = "2021"
description = "Browse the contents of a Discord data package"
# Original tool by aamiaa: https://github.com/aamiaa/Data-Package-Tool
# This is a Rust rewrite of it.

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
csv = "1"
zip = { version = "9", features = ["chrono"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
dirs = "7"
rfd = "0.18"
reqwest = { version = "0.13", features = ["blocking", "json"] }
image = "0.25"
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
