name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: x86_64-linux
            bin: data-package-tool
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aarch64-macos
            bin: data-package-tool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: x86_64-windows
            bin: data-package-tool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            libwayland-dev libxrandr-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          stage="data-package-tool-${{ matrix.asset }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/data-package-tool" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "$stage.tar.gz" "$stage"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "data-package-tool-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/data-package-tool.exe" $stage/
          Copy-Item README.md, LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data-package-tool-${{ matrix.asset }}.tar.gz
            data-package-tool-${{ matrix.asset }}.zip
          generate_release_notes: true
